<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>채용 파이프라인 · ATS 데모</title>
<style>
  :root{
    --bg:#F4F6F8;--surface:#fff;--ink:#1A1D21;--muted:#5B6672;--faint:#9AA4B0;
    --line:#E4E8EC;--primary:#24486E;--primary-soft:#EAF1F8;--shadow:0 1px 3px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh}

  /* ── left: job list ── */
  .side{width:248px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;height:100vh}
  .side-brand{display:flex;align-items:center;gap:9px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .side-brand .logo{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .side-brand b{font-size:14px;letter-spacing:-.02em}
  .side-brand span{font-size:10.5px;color:var(--faint);display:block;margin-top:1px}
  .side-newjob{margin:14px 14px 8px;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--primary);color:#fff;border:0;border-radius:9px;padding:10px;font:inherit;font-size:13px;
    font-weight:700;cursor:pointer}
  .side-newjob:hover{background:#1d3c5f}
  .side-label{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--faint);
    text-transform:uppercase;padding:10px 18px 6px}
  .job-list{flex:1;overflow-y:auto;padding:0 10px 14px}
  .job-item{border-radius:9px;padding:10px 12px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
  .job-item:hover{background:#F6F8FA}
  .job-item.active{background:var(--primary-soft);border-color:#D5E0EC}
  .job-item .jt{font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
  .job-item.active .jt{color:var(--primary)}
  .job-item .jm{display:flex;align-items:center;gap:8px;margin-top:5px}
  .job-item .jdept{font-size:11px;color:var(--muted)}
  .job-item .jcount{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);
    background:#EEF1F4;border-radius:20px;padding:1px 8px}
  .job-item.active .jcount{background:#fff;color:var(--primary)}
  .side-foot{border-top:1px solid var(--line);padding:10px 18px}
  .side-foot a{font-size:11px;color:var(--faint);cursor:pointer;text-decoration:underline}
  .cloud{font-size:11px;font-weight:700;margin-bottom:6px}
  .cloud.on{color:#2E8B67}
  .cloud.off{color:#C0842D}
  .reject-store{display:flex;align-items:center;gap:9px;margin:0 10px 8px;padding:11px 12px;border-radius:9px;
    cursor:pointer;border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700}
  .reject-store svg{color:#C0492D;flex-shrink:0}
  .reject-store:hover{background:#FBF2F0;border-color:#E8C9C2}
  .reject-store.active{background:#FBF2F0;border-color:#E0B3A8;color:#B23A22}
  .reject-store .rs-count{margin-left:auto;font-size:10.5px;background:#F1E4E1;color:#B23A22;border-radius:20px;padding:1px 8px}
  .reapply-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#B23A22;
    background:#FBE9E5;border-radius:20px;padding:2px 8px;margin-top:8px}
  .reapply-banner{background:#FBE9E5;border:1px solid #F0C9C0;border-radius:10px;padding:10px 12px;margin-bottom:14px;
    font-size:12px;color:#8F2E1B;line-height:1.5}
  .reapply-banner b{font-weight:800}
  .rej-list{flex:1;overflow-y:auto;padding:16px 22px;display:flex;flex-direction:column;gap:10px}
  .rej-card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
    display:flex;align-items:flex-start;gap:14px;box-shadow:var(--shadow)}
  .rej-card .rc-main{flex:1;min-width:0}
  .rej-card .rc-name{font-size:14px;font-weight:800}
  .rej-card .rc-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .rej-card .rc-reason{font-size:12px;color:#8F2E1B;background:#FBF2F0;border-radius:8px;padding:7px 10px;margin-top:9px}
  .rej-card .rc-tools{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .rej-card .rc-tools button{font:inherit;font-size:11.5px;font-weight:700;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .rej-card .rc-view{border:1px solid var(--line);background:#fff;color:var(--ink)}
  .rej-card .rc-view:hover{background:#F3F5F8}
  .rej-card .rc-restore{border:0;background:var(--primary);color:#fff}
  .rej-card .rc-restore:hover{background:#1d3c5f}
  .rej-empty{text-align:center;color:var(--faint);font-size:13px;padding:60px 0}
  .btn.danger{background:#fff;color:#C0492D;border:1px solid #E8CDC6}
  .btn.danger:hover{background:#FBF2F0}
  /* interview overlay */
  .itv{position:fixed;inset:0;background:rgba(20,22,27,.45);display:none;z-index:55;padding:22px}
  .itv.show{display:flex}
  .itv-box{margin:auto;background:var(--surface);width:840px;max-width:100%;height:100%;max-height:920px;
    border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28)}
  .itv-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .itv-head .t{font-size:16px;font-weight:800}
  .itv-head .s{font-size:12px;color:var(--muted);margin-top:2px}
  .itv-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
  .itv-body{flex:1;overflow-y:auto;padding:18px}
  .itv-summary{background:#F6F3FC;border:1px solid #E7DFF6;border-radius:12px;padding:14px;margin-bottom:16px}
  .itv-summary .big{font-size:26px;font-weight:800}
  .audio-row{display:flex;align-items:center;gap:10px;background:#F6F8FA;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:16px;flex-wrap:wrap}
  .audio-row audio{height:34px;max-width:100%}
  .q-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
  .q-card .qn{font-size:13px;font-weight:700;line-height:1.5;margin-bottom:9px;display:flex;gap:8px}
  .q-card .qn .num{color:var(--primary);font-weight:800;flex-shrink:0}
  .q-card textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;
    font-size:12.5px;outline:0;resize:vertical;min-height:64px;line-height:1.6;color:var(--ink)}
  .q-card textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .q-card .qa{display:flex;align-items:center;gap:8px;margin-top:8px}
  .rec-btn{font:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;
    border-radius:8px;padding:7px 11px;cursor:pointer}
  .rec-btn.on{background:#FBE9E5;border-color:#E8A99D;color:#B23A22}
  .q-eval{margin-top:9px;font-size:11.5px;padding:8px 10px;border-radius:8px;background:#EEF4F9;color:#2A4A63}
  .q-eval b{font-weight:800}
  .rec-panel{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;background:#fff}
  .rec-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .rec-all{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;
    background:var(--primary);color:#fff}
  .rec-all:hover{background:#1d3c5f}
  .rec-all.on{background:#C0492D}
  .rec-all.on:hover{background:#a53c22}
  .rec-status{font-size:11.5px;font-weight:700;color:#C0492D}
  .rec-label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--faint);margin-bottom:6px}
  .transcript{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit;font-size:13px;
    outline:0;resize:vertical;min-height:150px;line-height:1.7;color:var(--ink)}
  .transcript:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .q-ref-title{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--faint);margin:6px 0 10px}
  .q-ref{display:flex;gap:8px;font-size:12.5px;line-height:1.5;padding:9px 12px;border:1px solid var(--line);
    border-radius:9px;margin-bottom:8px;background:#FBFCFD}
  .q-ref .num{color:var(--primary);font-weight:800;flex-shrink:0}

  /* ── main ── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .mhead{padding:16px 22px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  .mhead-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mhead h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .mhead .req{font-size:12px;color:var(--muted);margin-top:3px}
  .mhead .spacer{flex:1}
  .search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;background:#fff}
  .search svg{color:var(--faint);flex-shrink:0}
  .search input{border:0;outline:0;font:inherit;font-size:13px;width:150px;background:transparent;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:0;
    border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .btn:hover{background:#1d3c5f}
  .btn.ghost{background:#F3F5F8;color:var(--ink)}
  .btn.ghost:hover{background:#E9ECF1}

  /* ── board ── */
  .board{flex:1;display:flex;gap:14px;padding:16px 22px;overflow-x:auto;overflow-y:hidden}
  .col{width:270px;min-width:270px;background:#EDF0F3;border-radius:12px;display:flex;flex-direction:column;max-height:100%}
  .col-head{padding:12px 14px 10px;display:flex;align-items:center;gap:8px}
  .col-head .dot{width:8px;height:8px;border-radius:50%}
  .col-head .name{font-size:12.5px;font-weight:800}
  .col-head .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:#fff;
    border-radius:20px;padding:1px 8px}
  .cards{flex:1;overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:9px}
  .col.over{outline:2px dashed var(--primary);outline-offset:-4px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;
    cursor:grab;box-shadow:var(--shadow)}
  .card:hover{border-color:#CBD5DF}
  .card.dragging{opacity:.5}
  .card .cn{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
  .card .cr{font-size:11.5px;color:var(--muted);margin-top:2px}
  .card .ct{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .chip{font-size:10px;font-weight:600;color:var(--muted);background:#EEF1F4;border-radius:20px;padding:2px 8px}
  .card .cf{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid #F0F2F5}
  .card .mini-fit{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px}
  .card .cdate{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .rate{display:flex;gap:2px}
  .rate i{width:6px;height:6px;border-radius:50%;background:#DCE1E7}
  .rate i.on{background:var(--primary)}
  .empty{font-size:11.5px;color:var(--faint);text-align:center;padding:14px 0}

  /* ── detail overlay ── */
  .detail{position:fixed;inset:0;background:rgba(20,22,27,.45);display:none;z-index:50;padding:22px}
  .detail.show{display:flex}
  .d-box{margin:auto;background:var(--surface);width:1140px;max-width:100%;height:100%;max-height:920px;
    border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28)}
  .d-head{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .d-head .d-stage{font-size:11px;font-weight:800;letter-spacing:.04em}
  .d-head .d-name{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
  .d-head .d-role{font-size:12.5px;color:var(--muted);margin-top:2px}
  .d-head-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
  .d-move{font:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:8px 12px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink)}
  .d-move:hover{background:#F3F5F8}
  .d-move.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .d-move:disabled{opacity:.4;cursor:not-allowed}
  .x{background:none;border:0;cursor:pointer;color:var(--faint);padding:6px;border-radius:7px}
  .x:hover{background:#F1F3F5;color:var(--ink)}
  .d-body{flex:1;display:flex;min-height:0}
  .d-main{flex:1;background:#EEF0F4;min-width:0;display:flex;flex-direction:column}
  .d-main .resume-frame{flex:1;border:0;width:100%;background:#fff}
  .img-wrap{flex:1;overflow:auto;display:flex;padding:18px}
  .resume-img{max-width:100%;max-height:100%;margin:auto;display:block;object-fit:contain}
  .resume-doc{flex:1;overflow:auto;padding:26px}
  .resume-doc .page{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:28px 32px;box-shadow:var(--shadow)}
  .resume-doc h3{font-size:19px;font-weight:800}
  .resume-doc .rd-role{font-size:12.5px;color:var(--muted);margin:4px 0 16px}
  .resume-doc .rd-h{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--faint);margin:16px 0 8px}
  .resume-doc .hl{font-size:13px;line-height:1.6;margin-bottom:7px;padding-left:14px;position:relative}
  .resume-doc .hl::before{content:"·";position:absolute;left:3px;color:var(--primary);font-weight:800}
  .d-side{width:384px;flex-shrink:0;border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 26px;background:#FBFCFD}
  .fit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .fit-top{display:flex;align-items:baseline;gap:7px}
  .fit-score{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .fit-unit{font-size:13px;color:var(--faint);font-weight:700}
  .fit-badge{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
  .fit-bar{height:8px;border-radius:6px;background:#EBEEF2;margin-top:10px;overflow:hidden}
  .fit-bar i{display:block;height:100%;border-radius:6px}
  .fit-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .sw{display:flex;gap:9px;margin-bottom:14px}
  .sw .col2{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
  .sw h5{font-size:11px;font-weight:800;margin-bottom:8px}
  .sw .pos h5{color:#2E8B67}.sw .neg h5{color:#C0492D}
  .sw ul{list-style:none}
  .sw li{font-size:11.5px;line-height:1.5;color:#3A4048;padding-left:13px;position:relative;margin-bottom:5px}
  .sw .pos li::before{content:"+";position:absolute;left:0;color:#2E8B67;font-weight:800}
  .sw .neg li::before{content:"\2212";position:absolute;left:0;color:#C0492D;font-weight:800}
  .side-sec{margin-bottom:14px}
  .side-sec .sh{display:flex;align-items:center;margin-bottom:8px}
  .side-sec .sh h4{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--faint)}
  .side-sec .sh .edit-btn{margin-left:auto;font:inherit;font-size:11px;font-weight:700;color:var(--primary);
    background:var(--primary-soft);border:1px solid #D5E0EC;border-radius:7px;padding:5px 10px;cursor:pointer}
  .kv{display:flex;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid #F1F3F5}
  .kv .k{color:var(--faint);width:78px;flex-shrink:0}
  .kv .v{color:var(--ink)}
  .ai-box{background:#F6F3FC;border:1px solid #E7DFF6;border-radius:10px;padding:11px 12px;font-size:12px;
    line-height:1.6;color:#4A4358}
  .ai-box .lab{font-size:10.5px;font-weight:800;color:#6D51C4;margin-bottom:5px}
  textarea.memo{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;
    font-size:12.5px;outline:0;resize:vertical;min-height:70px;line-height:1.6;color:var(--ink)}
  textarea.memo:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .efield{margin-bottom:10px}
  .efield label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .efield input,.efield textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;
    font:inherit;font-size:12px;outline:0;color:var(--ink)}
  .efield textarea{resize:vertical;min-height:72px;line-height:1.6}
  .efield input:focus,.efield textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .erow{display:flex;gap:8px;margin-top:8px}
  .erow .btn{flex:1;justify-content:center}

  /* ── modals ── */
  .modal{position:fixed;inset:0;background:rgba(20,22,27,.45);display:none;z-index:60;padding:22px}
  .modal.show{display:flex}
  .modal .box{margin:auto;background:#fff;border-radius:14px;width:440px;max-width:100%;max-height:90vh;
    overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;
    font:inherit;font-size:12.5px;outline:0;color:var(--ink)}
  .field textarea{resize:vertical;min-height:66px;line-height:1.6}
  .field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .field .hint{font-size:10.5px;color:var(--faint);margin-top:4px}
  .file-drop{display:flex;align-items:center;gap:9px;border:1px dashed var(--line);border-radius:9px;
    padding:10px 11px;cursor:pointer;background:#F7F9FB}
  .file-drop:hover{border-color:var(--primary);background:var(--primary-soft)}
  .file-drop.filled{border-style:solid;border-color:var(--primary);background:var(--primary-soft)}
  .file-drop.drag{border-style:solid;border-color:var(--primary);background:#DEE9F3;transform:scale(1.01)}
  .file-drop input{display:none}
  .file-drop svg{color:var(--muted);flex-shrink:0}
  .file-drop .fi-name{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-drop.filled .fi-name{color:var(--primary);font-weight:600}
  .row{display:flex;gap:9px;margin-top:8px}
  .row .btn{flex:1;justify-content:center}
  .two{display:flex;gap:10px}
  .two .field{flex:1}

  /* ── mobile ── */
  @media(max-width:820px){
    .app{flex-direction:column;height:auto;min-height:100vh}
    body{overflow:auto;height:auto}
    .side{width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
    .side-brand{padding:12px 14px}
    .side-newjob{margin:10px 14px 6px}
    .side-label{display:none}
    .job-list{display:flex;flex:none;overflow-x:auto;overflow-y:hidden;gap:8px;padding:4px 14px 12px}
    .job-item{min-width:190px;flex-shrink:0;margin-bottom:0;border:1px solid var(--line)}
    .job-item.active{border-color:#D5E0EC}
    .side-foot{display:none}
    .main{min-height:auto}
    .board{flex-direction:column;overflow-x:hidden;padding:14px}
    .col{width:auto;min-width:0;max-height:none;background:#E9ECF1}
    .cards{overflow:visible;flex:none}
    .card{cursor:pointer}
    .detail{padding:0}
    .d-box{border-radius:0;max-height:100%}
    .d-body{flex-direction:column}
    .d-main{flex:none;min-height:44vh}
    .d-side{width:auto;border-left:0;border-top:1px solid var(--line)}
    .d-head{flex-wrap:wrap}

/* ── Supabase 클라우드 연결 ── */
const SUPABASE_URL = "https://nkdhbpkuyemejpzyvleu.supabase.co";
const SUPABASE_KEY = "sb_publishable_mTPl3AV_37DJbclJkBMx6w_81Q_pXtz";
const SB_HEADERS = { "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, "Content-Type":"application/json" };
const STORE = "ats_jobs_v1";          // 로컬 캐시(파일 포함 전체 보관)
let cloudOK = false;

function setCloud(ok, msg){
  cloudOK = ok;
  const el = document.getElementById("cloudStatus");
  if(el){ el.textContent = msg; el.className = "cloud "+(ok?"on":"off"); }
}
// 큰 파일(이력서·녹음)은 제외한 '가벼운' 복사본 (클라우드 저장용)
function lightCopy(){
  return JOBS.map(j=>({ ...j, cands:(j.cands||[]).map(c=>({ ...c, fileData:"", audioData:"" })) }));
}
let pushTimer=null;
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(JOBS)); }catch(e){ console.warn("로컬 저장 실패",e); }
  clearTimeout(pushTimer);
  pushTimer = setTimeout(cloudPush, 700);   // 잠깐 모아서 한 번에 전송
  return true;
}
async function cloudPush(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?on_conflict=id`, {
      method:"POST",
      headers:{ ...SB_HEADERS, "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ id:"main", data: lightCopy(), updated_at:new Date().toISOString() })
    });
    if(res.ok) setCloud(true, "☁ 동기화됨");
    else setCloud(false, "⚠ 동기화 오류 "+res.status);
  }catch(e){ setCloud(false, "⚠ 오프라인(로컬 저장됨)"); }
}
async function load(){
  let cloud=null;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.main&select=data`, { headers:SB_HEADERS });
    if(res.ok){ const rows=await res.json(); if(rows.length && Array.isArray(rows[0].data)) cloud=rows[0].data; setCloud(true,"☁ 동기화됨"); }
    else setCloud(false, "⚠ 연결 오류 "+res.status);
  }catch(e){ setCloud(false, "⚠ 오프라인(로컬 사용)"); }

  let localRaw=null;
  try{ const r=localStorage.getItem(STORE); if(r){ const a=JSON.parse(r); if(Array.isArray(a)) localRaw=a; } }catch(e){}

  if(cloud && cloud.length){
    // 클라우드 데이터를 기준으로 하되, 이 기기에 있는 첨부파일을 다시 붙여줌
    const fileMap={};
    if(localRaw) for(const j of localRaw) for(const c of (j.cands||[])) fileMap[c.id]={fileData:c.fileData,audioData:c.audioData};
    for(const j of cloud) for(const c of (j.cands||[])){ const f=fileMap[c.id]; if(f){ if(f.fileData)c.fileData=f.fileData; if(f.audioData)c.audioData=f.audioData; } }
    JOBS=cloud;
    try{ localStorage.setItem(STORE, JSON.stringify(JOBS)); }catch(e){}
  } else if(localRaw && localRaw.length){
    JOBS=localRaw; cloudPush();          // 클라우드는 비었는데 로컬에 있으면 올려줌
  } else {
    JOBS=seed(); cloudPush();            // 완전 첫 실행
  }
}

let JOBS=[];
let curJob=null;
let openId=null, dragId=null, editMode=false, blobUrl=null, pickedFile=null;
let nextJobId=1, nextCandId=101;
function computeIds(){
  nextJobId=Math.max(0,...JOBS.map(j=>+j.id||0))+1;
  nextCandId=Math.max(100,...JOBS.flatMap(j=>(j.cands||[]).map(c=>+c.id||0)))+1;
}
async function init(){
  await load();
  curJob = JOBS[0] ? JOBS[0].id : null;
  computeIds();
  render();
}

function job(){return JOBS.find(j=>j.id===curJob)||JOBS[0];}
function reqText(j){const parts=[j.dept,`경력 ${j.minYears}년↑`];if(j.must&&j.must.length)parts.push(j.must.join("·"));return parts.join(" · ");}

let view="job";   // "job" | "rejected"
function sameId(a,b){
  const ea=(a.email||"").trim().toLowerCase(), eb=(b.email||"").trim().toLowerCase();
  if(ea&&eb) return ea===eb;                       // 이메일 우선
  const na=(a.name||"").trim(), nb=(b.name||"").trim();
  return na!=="" && na===nb;                        // 없으면 이름
}
function reapplyInfo(c){                             // 모든 공고 통틀어 감지
  let active=null;
  for(const j of JOBS){
    for(const o of j.cands){
      if(o.id===c.id) continue;
      if(!sameId(c,o)) continue;
      if(o.rejected) return {type:"rejected",job:j.title,stage:o.rejectStage||"",reason:o.rejectReason||""};
      if(!active) active={type:"active",job:j.title,stage:STAGES[stageIdx(o.stage)].name};
    }
  }
  return active;
}
function rejectedAll(){const out=[];for(const j of JOBS)for(const c of j.cands)if(c.rejected)out.push({c,j});return out;}
function jobOf(id){return JOBS.find(j=>j.cands.some(c=>c.id===id))||job();}
function render(){renderSide(); if(view==="rejected"){renderRejectView();} else {renderHead();renderBoard();}}

/* ── render ── */
function renderSide(){
  $("#jobList").innerHTML=JOBS.map(j=>`
    <div class="job-item ${view==='job'&&j.id===curJob?'active':''}" onclick="selectJob(${j.id})">
      <div class="jt">${esc(j.title)}</div>
      <div class="jm"><span class="jdept">${esc(j.dept)}</span><span class="jcount">지원 ${j.cands.filter(c=>!c.rejected).length}</span></div>
    </div>`).join("");
  $("#rejectCount").textContent=rejectedAll().length;
  $("#rejectStore").classList.toggle('active', view==="rejected");
}
function renderHead(){
  const j=job();
  $("#jobTools").style.display="flex";
  $("#jobTitle").textContent=j.title;
  $("#jobReq").textContent=reqText(j);
}
function renderRejectView(){
  $("#jobTools").style.display="none";
  $("#jobTitle").textContent="불합격 보관함";

/* ── fit analysis ── */
function yearsOf(role){const m=(role||"").match(/(\d+)\s*년/);let y=m?+m[1]:0;if(/신규|신입/.test(role||"")&&!m)y=1;return y;}
function analyze(c,j){
  const text=[c.role,(c.tags||[]).join(" "),(c.hl||[]).join(" "),c.memo||""].join(" ");
  const y=yearsOf(c.role); const minY=j.minYears||1;
  let exp=y>=minY?Math.min(40,30+(y-minY)*2):Math.round(30*y/minY);
  const nice=[...new Set((j.nice||[]).filter(k=>text.includes(k)))];
  const must=[...new Set((j.must||[]).filter(k=>text.includes(k)))];
  const neg=[...new Set(["미달","공백","제한적","미확인"].filter(k=>text.includes(k)))];
  const score=Math.max(5,Math.min(99,Math.round(exp+Math.min(45,nice.length*9)+Math.min(15,must.length*8)-neg.length*7)));
  const lead=["리더십","팀장","프리셉터","교육","파트장"];
  const skills=nice.filter(k=>!lead.includes(k));
  const strong=[];
  if(y>=minY)strong.push(`경력 ${y}년 — 요건(${minY}년↑) 충족`);
  if(must.length)strong.push(`${must.join("·")} 조건 부합`);
  if(skills.length)strong.push(`핵심 역량: ${skills.slice(0,5).join(", ")}`);
  if(nice.some(k=>lead.includes(k)))strong.push("리더십·교육 경험 보유");
  if(!strong.length)strong.push("이력서 하이라이트를 입력하면 강점이 분석됩니다");
  const weak=[];
  if(y<minY)weak.push(`경력 ${y}년 — 요건(${minY}년↑) 미달`);
  if((j.must||[]).length&&!must.length)weak.push(`${j.must.join("·")} 이력 미확인`);
  if(skills.length<2)weak.push("직무 핵심 역량 키워드 부족");
  if(neg.length)weak.push(`검토 필요 표현: ${neg.join("·")}`);
  if(!weak.length)weak.push("두드러진 약점 없음 — 면접에서 심화 확인 권장");
  const band=score>=75?["적합도 높음","#2E8B67","#E7F4EE"]:score>=55?["적합도 보통","#2C6FB0","#E7F0F9"]:["적합도 낮음","#C0842D","#FBF1E0"];
  return {score,strong,weak,band};
}

/* ── detail ── */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function revokeBlob(){if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null;}}
function resumeBlob(c){
  if(!c.fileData)return null;
  try{
    const p=c.fileData.split(",");const mime=(p[0].match(/:(.*?);/)||[])[1]||"application/octet-stream";
    const bin=atob(p[1]);const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    revokeBlob();blobUrl=URL.createObjectURL(new Blob([arr],{type:mime}));
    return {url:blobUrl,mime};
  }catch(e){return null;}
}
function guessMime(name){
  const ext=(name||"").toLowerCase().split(".").pop();
  if(ext==="pdf") return "application/pdf";
  if(["png","jpg","jpeg","gif","webp"].includes(ext)) return "image/"+(ext==="jpg"?"jpeg":ext);
  return "application/octet-stream";
}
function resumeSrc(c){
  if(c.fileUrl) return {url:c.fileUrl, mime:guessMime(c.fileName)};   // 클라우드(모든 기기 공용)
  return resumeBlob(c);                                                // 로컬 임시본(업로드 중이거나 오프라인)
}
/* ── Storage(클라우드 파일 저장) ── */
async function uploadToStorage(file, folder){
  try{
    const safe=(file.name||"file").replace(/[^\w.\-]/g,"_");
    const path=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safe}`;
    const res=await fetch(`${SUPABASE_URL}/storage/v1/object/resumes/${path}`,{
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY, "Content-Type": file.type||"application/octet-stream" },
      body:file
    });
    if(!res.ok){ console.warn("업로드 실패",res.status, await res.text()); return null; }
    return `${SUPABASE_URL}/storage/v1/object/public/resumes/${path}`;
  }catch(e){ console.warn("업로드 오류",e); return null; }
}
async function uploadAndAttach(c, file, kind){
  const url = await uploadToStorage(file, kind);
  if(url){
    if(kind==="resume") c.fileUrl=url; else c.audioUrl=url;
    save();
    if(openId===c.id) renderDetail();
    render();
  }
}

/* ── drag & drop ── */
function dragStart(e,id){dragId=id;e.currentTarget.classList.add('dragging');}
function dragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('over');}
function dragLeave(e){e.currentTarget.classList.remove('over');}
function drop(e,stage){
  e.preventDefault();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  const c=findCand(dragId);
  if(c&&c.stage!==stage){c.stage=stage;save();render();if(openId===c.id)renderDetail();}
  dragId=null;
}

async function handleResumeFile(f){
  pickedFile=f||null;
  $("#aFileName").textContent=f?f.name:"여기로 끌어다 놓거나 클릭 (PDF · JPG · PNG)";
  $("#aFileDrop").classList.toggle('filled',!!f);

    $("#aFileName").textContent=f.name+" · 정보 추출 중...";

      if(!txt.trim()){ $("#aFileName").textContent=f.name+" · 글자 추출 불가(스캔본?) · 직접 입력하세요"; return; }
      const n=autofillFrom(txt);
      $("#aFileName").textContent=f.name+(n?` · 자동 입력 ${n}개 항목 ✓ (확인 후 등록)`:" · 자동 추출 결과 없음");
    }catch(e){ console.warn("pdf extract",e); $("#aFileName").textContent=f.name+" · 추출 실패 · 직접 입력하세요"; }
  }
}
async function extractPdfText(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const c=await page.getTextContent();
    text+=c.items.map(it=>it.str).join(" ")+"\n";
  }
  return text;
}
function autofillFrom(t){
  const lines=t.split(/\n|\s{2,}/).map(s=>s.trim()).filter(Boolean);
  let filled=0;
  const em=(t.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[])[0];
  if(em && !$("#aEmail").value){ $("#aEmail").value=em; filled++; }
  const ph=(t.match(/01[016-9][-\s.)]?\s?\d{3,4}[-\s.]?\d{4}/)||[])[0];
  if(ph && !$("#aPhone").value){ $("#aPhone").value=ph.replace(/[\s.)]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,""); filled++; }
  const yr=t.match(/경력\s*(\d+)\s*년/)||t.match(/총\s*(\d+)\s*년/)||t.match(/(\d+)\s*년\s*\d+\s*개월/)||t.match(/(\d+)\s*년\s*(?:경력|이상)/);
  let name="";
  let m=t.match(/(?:이름|성명|성\s*명)\s*[:：]?\s*([가-힣]{2,4})/);
  if(m) name=m[1];
  const nameStop=["동료","경력","학력","자격","이력","주소","연락","성별","포지션","접수",
    "연봉","희망연봉","학점","전공","지역","구분","소재지","학교명","재학기간","근무기간",
    "회사명","부서","직급","직책","희망","포트폴리오","최종학력","취득일","수상일","발행처",
    "기관","합격","점수","어학","수상내역","근무형태","근무지","희망근무지","자기소개","자기소개서",
    "신입","인턴","정규직","계약직","프리랜서","경력사항","학력사항","지원분야","입사지원일","최종"];
  // 이름 바로 뒤에 학력/경력 표 제목이 붙는 사람인 인쇄본 패턴 (가장 신뢰도 높음)
  if(!name){ let x=t.match(/([가-힣]{2,4})\s*(?:재학기간|학력사항|경력사항)/); if(x&&!nameStop.includes(x[1])) name=x[1]; }
  if(!name){ let x=t.match(/([가-힣]{2,4})\s*(?:남|여|남자|여자)\s+(?:19|20)?\d/); if(x&&!nameStop.includes(x[1])) name=x[1]; }
  if(!name){ let x=t.match(/([가-힣]{2,4})\s*입니다/); if(x&&!nameStop.includes(x[1])) name=x[1]; }
  if(!name){ let x=t.match(/([가-힣]{2,4})\s*(?:19|20)\d{2}\s*년\s*(?:생|\()/); if(x&&!nameStop.includes(x[1])) name=x[1]; }
  if(!name){
    const stop=["이력서","자기소개","경력기술","지원서","포트폴리오","담당자","주식회사","연락처","전화번호"];
    for(const ln of lines.slice(0,8)){ if(/^[가-힣]{2,4}$/.test(ln) && !stop.some(s=>ln.includes(s))){ name=ln; break; } }
  }
  // 최종 안전망: 이메일·전화번호 "바로 앞"에는 거의 항상 이름이 있음 (표 순서가 뒤섞여도 이 근접성은 유지됨)
  if(!name){
    const anchor = em ? t.indexOf(em) : (ph ? t.indexOf(ph) : -1);
    if(anchor > 0){
      const win = t.slice(Math.max(0, anchor-120), anchor);
      const cands = win.match(/[가-힣]{2,4}/g) || [];
      for(let i=cands.length-1;i>=0;i--){ if(!nameStop.includes(cands[i])){ name=cands[i]; break; } }
    }
  }
  if(name && !$("#aName").value){ $("#aName").value=name; filled++; }
  if(!$("#aRole").value && yr){ $("#aRole").value="경력 "+yr[1]+"년"; filled++; }
  const BAD=/(학력|졸업|대학교|대학원|고등학교|논문|어학|자격증|인턴|대외활동|해외경험|접수번호|포지션|사람인)/;
  let cm=t.match(/((?:주식회사|㈜|\(주\))\s*[가-힣A-Za-z0-9]{1,20})/);
  if(!cm) cm=t.match(/([가-힣A-Za-z0-9]{2,20}(?:병원|의원|치과|한의원|클리닉|약국|의료원|법인|컨설팅|그룹|센터|주식회사))/);
  if(cm && !BAD.test(cm[1]) && !$("#aHosp").value){ $("#aHosp").value=cm[1].replace(/\s+/g," ").trim(); filled++; }
  // 주소: '시/도 + 시·군·구 + 동/읍/면/로/길' 형태만 인식 (표에 섞인 학력·경력 배제)
  let addr="";
  const addrRe=/((?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(?:특별시|광역시|특별자치시|도|특별자치도)?\s?[가-힣]{1,10}(?:시|군|구)\s?[가-힣0-9]{0,12}(?:동|읍|면|로|길|가|리))/;
  const am=t.match(addrRe);
  if(am && !BAD.test(am[1])) addr=am[1].replace(/\s+/g," ").trim();
  if(!addr){
    let lm=t.match(/(?:주소|거주지)\s*[:：]?\s*([^\n]{4,40})/);
    if(lm){ const v=lm[1].split(/\s{2,}|학력|경력|자격|졸업/)[0].trim();
      if(v.length>=4 && /(동|읍|면|로|길|가|리)$/.test(v.replace(/\s+/g,"")) && !BAD.test(v)) addr=v; }
  }
  if(addr && !$("#aAddr").value){ $("#aAddr").value=addr; filled++; }
  const dict=["인사","노무","급여","채용","평가","보상","HRD","HRM","HRBP","교육","ERP","SAP","엑셀","Excel","조직문화","노사","중환자실","응급실","병동","프리셉터","ACLS","수술실","상담","고객","CS","예약","마케팅","회계","재무","총무","경영지원"];
  const tags=[...new Set(dict.filter(k=>t.includes(k)))].slice(0,6);
  if(tags.length && !$("#aTags").value){ $("#aTags").value=tags.join(", "); filled++; }
  if(!$("#aHl").value){
    const hl=lines.filter(l=>/(년|담당|관리|운영|경험|수행|프로젝트|성과|구축|개선)/.test(l)
      && l.length>=6 && l.length<=70
      && !/(만\s*\d+\s*세|접수번호|포지션|Email|@|휴대폰|전화|주소|성별|졸업논문)/.test(l)).slice(0,4);
    if(hl.length){ $("#aHl").value=hl.join("\n"); filled++; }
  }
  return filled;
}

function genQuestions(c,j){
  const y=yearsOf(c.role);
  const text=[c.role,(c.tags||[]).join(" "),(c.hl||[]).join(" ")].join(" ");
  const hits=[...new Set((j.nice||[]).filter(k=>text.includes(k)))];
  const lead=["리더십","팀장","프리셉터","교육","파트장"];
  const Q=[];
  Q.push(`${c.name}님, 간단한 자기소개와 '${j.title}' 직무에 지원하신 동기를 말씀해 주세요.`);
  Q.push(`이전 소속(${c.hosp})에서 담당하신 핵심 업무와 가장 큰 성과는 무엇이었나요?`);
  if(y>=(j.minYears||0)) Q.push(`${y}년의 경력 중, 이 직무에 가장 직접적으로 도움이 될 경험을 구체적으로 설명해 주세요.`);
  else Q.push(`요구 경력(${j.minYears}년) 대비 부족할 수 있는 부분을 어떻게 보완할 계획인지 말씀해 주세요.`);
  hits.filter(k=>!lead.includes(k)).slice(0,4).forEach(k=>Q.push(`'${k}' 관련 경험을 실제 사례 중심으로 설명해 주세요.`));
  (j.must||[]).forEach(m=>Q.push(`이 포지션은 '${m}' 조건이 중요합니다. 관련 경험이나 대응 가능 여부를 말씀해 주세요.`));
  (c.tags||[]).slice(0,3).forEach(t=>Q.push(`이력서에 기재하신 '${t}'와 관련해 실제 수행 내용을 설명해 주세요.`));
  if(hits.some(k=>lead.includes(k))) Q.push(`팀을 이끌거나 후배를 교육한 경험에서 가장 크게 배운 점은 무엇인가요?`);
  Q.push(`업무 중 큰 어려움을 겪은 상황과, 그것을 어떻게 해결했는지 사례를 들어 주세요.`);
  Q.push(`동료·상사와 의견이 충돌했을 때 어떻게 조율하셨는지 말씀해 주세요.`);
  Q.push(`가장 개선하고 싶은 본인의 약점은 무엇이고, 어떤 노력을 하고 계신가요?`);
  Q.push(`입사 후 6개월~1년 내 이루고 싶은 목표가 있다면 무엇인가요?`);
  Q.push(`마지막으로, 저희 조직이나 직무에 대해 궁금한 점이 있으신가요?`);
  return [...new Set(Q)];
}
function scoreAnswer(txt){
  const t=(txt||"").trim(); if(!t) return {s:0,note:"미응답"};
  const words=t.replace(/\s+/g," ").split(" ").length;
  let s=0; const notes=[];
  if(words>=60){s+=45;notes.push("충분한 분량");} else if(words>=25){s+=30;notes.push("적정 분량");} else {s+=15;notes.push("답변이 다소 짧음");}
  if(/\d+\s*(년|개월|명|건|%|억|만원|배|위|점)/.test(t)){s+=25;notes.push("정량적 근거 제시");} else {notes.push("구체적 수치 보강 권장");}
  if(/(예를 들|사례|당시|구체적으로|결과적으로|그래서|때문에|위해)/.test(t)){s+=20;notes.push("사례·논리 구조 양호");} else {notes.push("사례 보강 권장");}
  if(/(협업|팀|함께|소통|조율|리드|주도)/.test(t)){s+=10;notes.push("협업/리더십 언급");}
  return {s:Math.min(100,s), note:notes.slice(0,2).join(" · ")};
}

}
function evaluateItv(){
  const c=findCand(itvId); if(!c)return;
  saveTranscript();
  const txt=(c.itvTranscript||"").trim();
  if(!txt){ alert("평가할 녹취록이 없습니다.\n녹음하거나 녹취록을 입력한 뒤 실행해 주세요."); return; }
  const r=scoreAnswer(txt);
  const comment= r.s>=75?"답변이 전반적으로 구체적이고 근거가 충실합니다.":r.s>=55?"기본기는 갖췄으나 사례·수치 보강이 필요합니다.":"답변이 짧거나 구체성이 부족합니다. 심화 질문을 권장합니다.";
  c.itvEval={total:r.s,comment,note:r.note}; save(); renderItv();
}
let recOn=false;
function setRecAllBtn(on){
  const b=document.getElementById("recAll"); if(b){ b.classList.toggle("on",on); b.textContent=on?"⏹ 녹음 중지":"🎤 전체 면접 녹음 시작"; }
  const st=document.getElementById("recStatus"); if(st) st.textContent=on?"● 녹음 중… 말하는 내용이 아래 녹취록에 실시간 기록됩니다":"";
}
function stopRec(){ if(rec){ try{rec.stop();}catch(e){} rec=null; } recOn=false; setRecAllBtn(false); }
function toggleRecAll(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert("이 브라우저는 음성 녹취를 지원하지 않습니다.\n크롬(PC·안드로이드)에서 쓰거나, 녹취록을 직접 입력하거나 파일 업로드를 이용하세요."); return; }
  if(recOn){ stopRec(); saveTranscript(); return; }
  const ta=document.getElementById("transcript");
  rec=new SR(); rec.lang="ko-KR"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=(e)=>{
    let fin="";
    for(let k=e.resultIndex;k<e.results.length;k++){ if(e.results[k].isFinal) fin+=e.results[k][0].transcript.trim()+" "; }
    if(fin && ta){ ta.value=(ta.value?ta.value.replace(/\s*$/,"")+" ":"")+fin; }
  };
  rec.onerror=(ev)=>{ console.warn("stt",ev&&ev.error); };
  rec.onend=()=>{ saveTranscript(); if(recOn){ try{rec.start();}catch(e){ stopRec(); } } else { setRecAllBtn(false); } };
  try{ rec.start(); recOn=true; setRecAllBtn(true); }catch(e){ alert("녹음을 시작할 수 없습니다. 마이크 권한을 확인해 주세요."); }
}
function renderItv(){
  const c=findCand(itvId); if(!c)return; const j=jobOf(itvId);
  $("#itvName").textContent=c.name+" · 면접 질문·평가";
  $("#itvJob").textContent=`${j.title} · ${c.role}`;
  let html=`<div class="audio-row">
    <button class="btn ghost" onclick="document.getElementById('audioFile').click()">🎧 녹취 파일 업로드</button>
    <input id="audioFile" type="file" accept="audio/*" style="display:none" onchange="onAudio()">
    ${(c.audioUrl||c.audioData)
      ? `<audio controls src="${c.audioUrl||c.audioData}"></audio><span style="font-size:11px;color:var(--muted)">${esc(c.audioName||"")}${c.audioUrl?" · ☁":""}</span>`
      : `<span style="font-size:11.5px;color:var(--faint)">mp3·m4a·wav 업로드 시 보관·재생됩니다 (자동 받아쓰기는 서버 필요).</span>`}
  </div>`;
  html+=`<div class="rec-panel">
    <div class="rec-top"><button class="rec-all" id="recAll" onclick="toggleRecAll()">🎤 전체 면접 녹음 시작</button>
      <span class="rec-status" id="recStatus"></span></div>
    <label class="rec-label">면접 녹취록 (전체)</label>
    <textarea id="transcript" class="transcript" placeholder="녹음 버튼을 누르면 말하는 내용이 여기에 실시간으로 쌓입니다. 직접 입력·수정도 가능합니다." onchange="saveTranscript()">${esc(c.itvTranscript||"")}</textarea>
  </div>`;
  if(c.itvEval){
    html+=`<div class="itv-summary">
      <div style="font-size:10.5px;font-weight:800;color:#6D51C4;margin-bottom:4px">✦ 면접 답변 평가 (데모 · 규칙 기반)</div>
      <span class="big">${c.itvEval.total}</span><span style="color:var(--faint);font-weight:700"> /100</span>
      <div class="fit-note" style="margin-top:6px">${esc(c.itvEval.comment)}${c.itvEval.note?" · "+esc(c.itvEval.note):""}</div></div>`;
  }
  html+=`<button class="btn" style="width:100%;justify-content:center;margin:6px 0 18px" onclick="evaluateItv()">✦ AI 녹취록 평가 실행 (규칙 기반)</button>`;
  html+=`<div class="q-ref-title">면접 질문지 (참고 · 순서대로 질문하세요)</div>`;
  c.itvQ.forEach((q,i)=>{ html+=`<div class="q-ref"><span class="num">Q${i+1}</span><span>${esc(q)}</span></div>`; });
  $("#itvBody").innerHTML=html;
}

/* ── reset ── */
async function cloudRefresh(){ await load(); curJob=(JOBS.find(j=>j.id===curJob)?curJob:(JOBS[0]&&JOBS[0].id)); computeIds(); closeDetail(); render(); }
function resetDemo(){if(confirm("등록한 데이터를 모두 지우고 데모 초기 상태로 되돌릴까요?\n(클라우드 데이터도 초기화됩니다)")){JOBS=seed();computeIds();curJob=JOBS[0].id;try{localStorage.removeItem(STORE);}catch(e){}cloudPush();closeDetail();render();}}

document.addEventListener('keydown',e=>{if(e.key==="Escape"){closeItv();closeDetail();closeAdd();closeJob();closeRej();}});

/* ── init ── */
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
init();
